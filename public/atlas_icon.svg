    <circle cx="130" cy="175" r="6"/><circle cx="270" cy="175" r="6"/>
  </g>
  <use xlink:href="#botd" href="#botd" x="84" y="66" width="92" height="83"/>
  <use xlink:href="#botd" href="#botd" x="224" y="66" width="92" height="83"/>
  <use xlink:href="#botd" href="#botd" x="84" y="196" width="92" height="83"/>
  <use xlink:href="#botd" href="#botd" x="224" y="196" width="92" height="83"/>
  <text x="200" y="338" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="10" fill="#FFFFFF">ATLAS</text>
  <text x="200" y="366" text-anchor="middle" font-family="Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#60A5FA"><tspan fill="#22D3EE" font-weight="700">A</tspan>GENTS <tspan fill="#22D3EE" font-weight="700">T</tspan>HAT <tspan fill="#22D3EE" font-weight="700">L</tspan>EARN, <tspan fill="#22D3EE" font-weight="700">A</tspan>CT &amp; <tspan fill="#22D3EE" font-weight="700">S</tspan>OLVE</text>
</svg>
