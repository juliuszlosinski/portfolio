  <rect width="400" height="400" rx="40" fill="#071A33"/>
  <rect width="400" height="400" rx="40" fill="url(#gridd)"/>
  <g stroke="#3B82F6" stroke-width="5" stroke-linecap="round">
    <line x1="130" y1="110" x2="270" y2="110"/>
    <line x1="130" y1="240" x2="270" y2="240"/>
    <line x1="130" y1="110" x2="130" y2="240"/>
    <line x1="270" y1="110" x2="270" y2="240"/>
  </g>
  <g fill="#22D3EE">
