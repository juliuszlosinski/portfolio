<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
  <title>ATLAS: cztery agenty w siatce (wersja ciemna, ikona)</title>
  <defs>
    <pattern id="gridd" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#3B82F6" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <symbol id="botd" viewBox="0 0 100 90">
      <line x1="50" y1="18" x2="50" y2="8" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="6" r="6" fill="#22D3EE"/>
      <rect x="2" y="40" width="10" height="24" rx="4" fill="#3B82F6"/>
      <rect x="88" y="40" width="10" height="24" rx="4" fill="#3B82F6"/>
      <rect x="10" y="18" width="80" height="68" rx="20" fill="#0A2540" stroke="#3B82F6" stroke-width="3"/>
      <rect x="22" y="38" width="56" height="26" rx="13" fill="#2563EB"/>
      <circle cx="38" cy="51" r="6" fill="#E0F2FE"/>
      <circle cx="62" cy="51" r="6" fill="#E0F2FE"/>
